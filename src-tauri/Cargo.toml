[package]
name = "nova"
version = "1.0.0"
description = "NOVA - Your desktop. Reimagined."
authors = ["NOVA Team"]
edition = "2021"

[lib]
name = "nova_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-log = "2"
sysinfo = "0.33"
rusqlite = { version = "0.32", features = ["bundled"] }
